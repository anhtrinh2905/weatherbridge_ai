# Infra-only subset — NOT the local topology.
# The canonical local topology is the repo-root `compose.yaml` (used by `make dev`
# and the Story 1.1 `docker compose up` path); it builds fe/be/worker/keycloak/proxy
# and runs migrations as a one-off job.
# This file only provisions backing services (db, keycloak-db, redis, mailpit, keycloak)
# and is layered by `make dev-prod` / `make dev-ai` via the .prod/.ai overlays.
# See docs/architecture/deployment.md#Compose-file-layout.
services:
  db:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: vai
      POSTGRES_PASSWORD: vai
      POSTGRES_DB: weather_bridge
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - weather-bridge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vai -d weather_bridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - weather-bridge-redis:/data
    command: redis-server --appendonly yes

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  keycloak:
    image: weather-bridge-keycloak
    build:
      context: ../..
      dockerfile: infra/docker/keycloak.Dockerfile
    command: start-dev --import-realm --spi-theme--static-max-age=-1 --spi-theme--cache-themes=false --spi-theme--cache-templates=false
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  weather-bridge-db:
  keycloak-db:
  weather-bridge-redis:
