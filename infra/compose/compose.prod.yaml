services:
  be:
    build:
      context: ../..
      dockerfile: infra/docker/be.Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PII_MODE: ${PII_MODE:-simulated}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      PII_HASH_KEY: ${PII_HASH_KEY:-}
      PII_KEY_VERSION: ${PII_KEY_VERSION:-v1}
      OBJECT_STORAGE_BASE_URL: ${OBJECT_STORAGE_BASE_URL:-}
      OBJECT_STORAGE_SIGNING_KEY: ${OBJECT_STORAGE_SIGNING_KEY:-}
      OBJECT_STORAGE_URL_TTL_SECONDS: ${OBJECT_STORAGE_URL_TTL_SECONDS:-300}
    restart: unless-stopped
    command: uv run --project /app/be --no-dev uvicorn --app-dir /app/be/src main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PII_MODE: ${PII_MODE:-simulated}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      PII_HASH_KEY: ${PII_HASH_KEY:-}
      PII_KEY_VERSION: ${PII_KEY_VERSION:-v1}
      NOTIFICATION_DELIVERY_MODE: ${NOTIFICATION_DELIVERY_MODE:-disabled}
    restart: unless-stopped
    command: uv run --project /app/worker --no-dev python /app/worker/src/main.py

  fe:
    build:
      context: ../..
      dockerfile: infra/docker/fe.Dockerfile
    restart: unless-stopped

  proxy:
    image: weather-bridge-proxy
    build:
      context: ../..
      dockerfile: infra/docker/proxy.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - fe
      - be

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped
