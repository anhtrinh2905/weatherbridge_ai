apiVersion: v1
kind: Service
metadata:
  name: fe
  namespace: weather-bridge
spec:
  selector:
    app: weather-bridge
    component: fe
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe
  namespace: weather-bridge
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: weather-bridge
      component: fe
  template:
    metadata:
      labels:
        app: weather-bridge
        component: fe
    spec:
      containers:
        - name: fe
          image: weather-bridge/fe:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
