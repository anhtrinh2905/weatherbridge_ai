apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: weather-bridge
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: weather-bridge
      component: worker
  template:
    metadata:
      labels:
        app: weather-bridge
        component: worker
    spec:
      containers:
        - name: worker
          image: weather-bridge/worker:placeholder
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          env:
            - name: WEB_PUSH_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: web-push-secret
                  key: WEB_PUSH_VAPID_PRIVATE_KEY
                  optional: true
            - name: SMS_TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: notification-providers-secret
                  key: SMS_TWILIO_ACCOUNT_SID
                  optional: true
            - name: SMS_TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-providers-secret
                  key: SMS_TWILIO_AUTH_TOKEN
                  optional: true
            - name: SMS_TWILIO_FROM
              valueFrom:
                secretKeyRef:
                  name: notification-providers-secret
                  key: SMS_TWILIO_FROM
                  optional: true
            - name: SMS_TWILIO_MESSAGING_SERVICE_SID
              valueFrom:
                secretKeyRef:
                  name: notification-providers-secret
                  key: SMS_TWILIO_MESSAGING_SERVICE_SID
                  optional: true
            - name: ZALO_OA_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-providers-secret
                  key: ZALO_OA_ACCESS_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
