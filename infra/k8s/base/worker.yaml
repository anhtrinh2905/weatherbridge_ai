apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: weather-bridge
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: weather-bridge
      component: worker
  template:
    metadata:
      labels:
        app: weather-bridge
        component: worker
    spec:
      containers:
        - name: worker
          image: weather-bridge/worker:placeholder
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          env:
            - name: WEB_PUSH_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: web-push-secret
                  key: WEB_PUSH_VAPID_PRIVATE_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
