# This Secret is consumed only by the worker. Keep provider credentials outside
# app-secret so the API never receives SMS or Zalo credentials.
apiVersion: v1
kind: Secret
metadata:
  name: notification-providers-secret
  namespace: weather-bridge
type: Opaque
stringData:
  SMS_TWILIO_ACCOUNT_SID: "REPLACE_FROM_GH_SECRET_SMS_TWILIO_ACCOUNT_SID"
  SMS_TWILIO_AUTH_TOKEN: "REPLACE_FROM_GH_SECRET_SMS_TWILIO_AUTH_TOKEN"
  SMS_TWILIO_FROM: "REPLACE_FROM_GH_SECRET_SMS_TWILIO_FROM"
  SMS_TWILIO_MESSAGING_SERVICE_SID: "REPLACE_FROM_GH_SECRET_SMS_TWILIO_MESSAGING_SERVICE_SID"
  ZALO_OA_ACCESS_TOKEN: "REPLACE_FROM_GH_SECRET_ZALO_OA_ACCESS_TOKEN"
