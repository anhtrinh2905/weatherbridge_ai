# Non-secret values live in configmap.yaml. This file documents the Secret shape.
# Real values are applied from GitHub Actions secrets during deploy; never commit
# real secret values. See infra/k8s/README.md for the required GitHub secret list.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: weather-bridge
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_FROM_GH_SECRET_APP_DATABASE_URL"
  KEYCLOAK_AUDIENCE: "REPLACE_FROM_GH_SECRET_APP_KEYCLOAK_AUDIENCE"
  LITELLM_API_KEY: "REPLACE_FROM_GH_SECRET_APP_LITELLM_API_KEY"
  LITELLM_MASTER_KEY: "REPLACE_FROM_GH_SECRET_APP_LITELLM_MASTER_KEY"
  OPENAI_API_KEY: "REPLACE_FROM_GH_SECRET_APP_OPENAI_API_KEY"
  LANGFUSE_PUBLIC_KEY: "REPLACE_FROM_GH_SECRET_APP_LANGFUSE_PUBLIC_KEY"
  LANGFUSE_SECRET_KEY: "REPLACE_FROM_GH_SECRET_APP_LANGFUSE_SECRET_KEY"
  PII_ENCRYPTION_KEY: "REPLACE_FROM_GH_SECRET_APP_PII_ENCRYPTION_KEY"
  PII_HASH_KEY: "REPLACE_FROM_GH_SECRET_APP_PII_HASH_KEY"
  OBJECT_STORAGE_BASE_URL: "REPLACE_FROM_GH_SECRET_APP_OBJECT_STORAGE_BASE_URL"
  OBJECT_STORAGE_SIGNING_KEY: "REPLACE_FROM_GH_SECRET_APP_OBJECT_STORAGE_SIGNING_KEY"
