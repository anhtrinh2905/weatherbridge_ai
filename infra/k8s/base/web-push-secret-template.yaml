# This Secret is consumed only by the worker. Keep it separate from app-secret
# so the API never receives the VAPID private key.
apiVersion: v1
kind: Secret
metadata:
  name: web-push-secret
  namespace: weather-bridge
type: Opaque
stringData:
  WEB_PUSH_VAPID_PRIVATE_KEY: "REPLACE_FROM_GH_SECRET_WEB_PUSH_VAPID_PRIVATE_KEY"
