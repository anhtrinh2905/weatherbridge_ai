apiVersion: v1
kind: Service
metadata:
  name: be
  namespace: weather-bridge
spec:
  selector:
    app: weather-bridge
    component: be
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: be
  namespace: weather-bridge
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weather-bridge
      component: be
  template:
    metadata:
      labels:
        app: weather-bridge
        component: be
    spec:
      initContainers:
        - name: migrate
          image: weather-bridge/be:placeholder
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - --project
            - /app/be
            - --no-dev
            - alembic
            - -c
            - /app/be/alembic.ini
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
      containers:
        - name: be
          image: weather-bridge/be:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
