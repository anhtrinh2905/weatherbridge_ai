name: weather-bridge

x-backend: &backend
  image: weather-bridge-be:local
  build:
    context: .
    dockerfile: infra/docker/be.Dockerfile
  environment: &backend-environment
    APP_ENV: development
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vai}:${POSTGRES_PASSWORD:-vai}@db:5432/${POSTGRES_DB:-weather_bridge}
    REDIS_URL: redis://redis:6379/0
    KEYCLOAK_URL: http://localhost:8080
    KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    KEYCLOAK_ISSUER: http://localhost:8080/realms/weather-bridge
    CORS_ORIGINS: http://localhost,http://localhost:5173
    LITELLM_ENABLED: "false"
    LANGFUSE_ENABLED: "false"
    GOOGLE_TRANSLATE_CREDENTIALS_PATH: ${GOOGLE_TRANSLATE_CREDENTIALS_PATH:-}
    PII_MODE: ${PII_MODE:-simulated}
    PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
    PII_HASH_KEY: ${PII_HASH_KEY:-}
    PII_KEY_VERSION: ${PII_KEY_VERSION:-v1}
    OBJECT_STORAGE_BASE_URL: ${OBJECT_STORAGE_BASE_URL:-http://localhost:9000/weatherbridge}
    OBJECT_STORAGE_S3_ENDPOINT: ${OBJECT_STORAGE_S3_ENDPOINT:-http://minio:9000}
    OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
    OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-weatherbridge}
    OBJECT_STORAGE_SIGNING_KEY: ${OBJECT_STORAGE_SIGNING_KEY:-dev-weatherbridge-object-signing-key}
    OBJECT_STORAGE_URL_TTL_SECONDS: ${OBJECT_STORAGE_URL_TTL_SECONDS:-300}
    NOTIFICATION_DELIVERY_MODE: ${NOTIFICATION_DELIVERY_MODE:-disabled}
    WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:dev@weatherbridge.local}
    WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
    WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}

services:
  ai-service:
    image: weather-bridge-ai:local
    build:
      context: ./ai
      dockerfile: ../infra/docker/ai.Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./ai/data:/app/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - weather-bridge-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-createbucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/weatherbridge || true;
      /usr/bin/mc anonymous set download myminio/weatherbridge;
      exit 0;
      "

  db:
    image: postgis/postgis:16-3.5-alpine
    # Official PostGIS tags are amd64-only; Docker Desktop on Apple Silicon
    # runs this via emulation. Remove if/when postgis publishes arm64 builds.
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vai}
      POSTGRES_DB: ${POSTGRES_DB:-weather_bridge}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - weather-bridge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vai} -d ${POSTGRES_DB:-weather_bridge}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - weather-bridge-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    restart: unless-stopped

  keycloak:
    image: weather-bridge-keycloak:local
    build:
      context: .
      dockerfile: infra/docker/keycloak.Dockerfile
    command:
      - start-dev
      - --import-realm
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  keycloak-sync:
    image: weather-bridge-keycloak:local
    entrypoint:
      - /bin/bash
      - /opt/keycloak/bin/sync-weather-bridge-realm.sh
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_SYNC_SERVER: http://keycloak:8080
      KEYCLOAK_SYNC_REALM: weather-bridge
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *backend
    command:
      - uv
      - run
      - --project
      - /app/be
      - --no-dev
      - alembic
      - -c
      - /app/be/alembic.ini
      - upgrade
      - head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  be:
    <<: *backend
    init: true
    ports:
      - "8000:8000"
    # Optional: only needed for live Hmong translation of dynamic content (alert bulletins).
    # If vertex-key.json is missing, Docker mounts an empty dir here and the endpoint just
    # returns 503 — the rest of the app is unaffected. See ai/translation/gemini_service.py.
    volumes:
      - ./vertex-key.json:/app/secrets/vertex-key.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak-sync:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    image: weather-bridge-worker:local
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      <<: *backend-environment
    init: true
    volumes:
      # Keep the catalog shipped in the image visible. Only generated outputs
      # are mounted so a host bind cannot mask /app/data/catalogs.
      - ./data/processed:/app/data/processed
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  fe:
    image: weather-bridge-fe:local
    build:
      context: .
      dockerfile: infra/docker/fe.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: weather-bridge
        VITE_KEYCLOAK_CLIENT_ID: weather-bridge-fe
        VITE_HAZARD_SOURCE: ${VITE_HAZARD_SOURCE:-api}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  proxy:
    image: weather-bridge-proxy:local
    build:
      context: .
      dockerfile: infra/docker/proxy.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      be:
        condition: service_healthy
      fe:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  weather-bridge-db:
  keycloak-db:
  weather-bridge-redis:
  weather-bridge-minio:
