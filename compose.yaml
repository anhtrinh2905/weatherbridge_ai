name: weather-bridge

x-backend: &backend
  image: weather-bridge-be:local
  build:
    context: .
    dockerfile: infra/docker/be.Dockerfile
  environment: &backend-environment
    APP_ENV: development
    DATABASE_URL: postgresql+asyncpg://vai:vai@db:5432/weather_bridge
    REDIS_URL: redis://redis:6379/0
    KEYCLOAK_URL: http://localhost:8080
    KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    KEYCLOAK_ISSUER: http://localhost:8080/realms/weather-bridge
    CORS_ORIGINS: http://localhost,http://localhost:5173
    LITELLM_ENABLED: "false"
    LANGFUSE_ENABLED: "false"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vai
      POSTGRES_PASSWORD: vai
      POSTGRES_DB: weather_bridge
    ports:
      - "5432:5432"
    volumes:
      - weather-bridge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vai -d weather_bridge"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - weather-bridge-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    restart: unless-stopped

  keycloak:
    image: weather-bridge-keycloak:local
    build:
      context: .
      dockerfile: infra/docker/keycloak.Dockerfile
    command:
      - start-dev
      - --import-realm
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  migrate:
    <<: *backend
    command:
      - uv
      - run
      - --project
      - /app/be
      - --no-dev
      - alembic
      - -c
      - /app/be/alembic.ini
      - upgrade
      - head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  be:
    <<: *backend
    init: true
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    image: weather-bridge-worker:local
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      <<: *backend-environment
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  fe:
    image: weather-bridge-fe:local
    build:
      context: .
      dockerfile: infra/docker/fe.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: weather-bridge
        VITE_KEYCLOAK_CLIENT_ID: weather-bridge-fe
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  proxy:
    image: weather-bridge-proxy:local
    build:
      context: .
      dockerfile: infra/docker/proxy.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      be:
        condition: service_healthy
      fe:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  weather-bridge-db:
  keycloak-db:
  weather-bridge-redis:
