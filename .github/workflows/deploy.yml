name: Publish GHCR Images

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  resolve-env:
    name: Resolve image channel
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
    steps:
      - id: resolve
        run: |
          case "${{ github.ref_name }}" in
            main) ENV="prod" ;;
            dev) ENV="dev" ;;
            *)
              echo "Only main and dev can publish deployment images." >&2
              exit 1 ;;
          esac
          echo "env=$ENV" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    needs: resolve-env
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile
      - run: uv sync --project be
      - run: uv sync --project worker
      - run: uv sync --project ai
      - run: make check
      - run: make test

  build-and-push:
    name: Build and publish immutable images
    runs-on: ubuntu-latest
    needs: [resolve-env, verify]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          ENV="${{ needs.resolve-env.outputs.env }}"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "channel=latest-$ENV" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/be.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weather-bridge-be:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weather-bridge-be:${{ steps.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=${{ steps.meta.outputs.source }}
            org.opencontainers.image.revision=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=be-${{ needs.resolve-env.outputs.env }}
          cache-to: type=gha,mode=max,scope=be-${{ needs.resolve-env.outputs.env }}
          provenance: mode=max
          sbom: true

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weather-bridge-worker:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weather-bridge-worker:${{ steps.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=${{ steps.meta.outputs.source }}
            org.opencontainers.image.revision=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=worker-${{ needs.resolve-env.outputs.env }}
          cache-to: type=gha,mode=max,scope=worker-${{ needs.resolve-env.outputs.env }}
          provenance: mode=max
          sbom: true

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/fe.Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_KEYCLOAK_URL=https://${{ needs.resolve-env.outputs.env == 'prod' && 'dienbien-auth' || 'dev-auth' }}.weatherbridge.online
            VITE_KEYCLOAK_REALM=weather-bridge
            VITE_KEYCLOAK_CLIENT_ID=weather-bridge-fe
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weather-bridge-fe:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weather-bridge-fe:${{ steps.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=${{ steps.meta.outputs.source }}
            org.opencontainers.image.revision=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=fe-${{ needs.resolve-env.outputs.env }}
          cache-to: type=gha,mode=max,scope=fe-${{ needs.resolve-env.outputs.env }}
          provenance: mode=max
          sbom: true

      - name: Build and push Keycloak
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/keycloak.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weather-bridge-keycloak:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/weather-bridge-keycloak:${{ steps.meta.outputs.channel }}
          labels: |
            org.opencontainers.image.source=${{ steps.meta.outputs.source }}
            org.opencontainers.image.revision=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=keycloak-${{ needs.resolve-env.outputs.env }}
          cache-to: type=gha,mode=max,scope=keycloak-${{ needs.resolve-env.outputs.env }}
          provenance: mode=max
          sbom: true
